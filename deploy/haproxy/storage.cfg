global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    option httpclose
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend s3
    bind :9000
    default_backend minio_cluster

backend minio_cluster
    balance roundrobin
    option httpchk
    http-check send meth GET uri /minio/health/ready ver HTTP/1.1 hdr Host minio
    http-check expect status 200
    server minio-1 minio-1:9000 check inter 2s fall 3 rise 2
    server minio-2 minio-2:9000 check inter 2s fall 3 rise 2
    server minio-3 minio-3:9000 check inter 2s fall 3 rise 2
    server minio-4 minio-4:9000 check inter 2s fall 3 rise 2
