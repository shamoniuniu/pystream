global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    option httpclose
    timeout connect 3s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 1s
    hold timeout 1s

frontend external_control
    bind :8080
    default_backend ready_leader

frontend internal_control
    bind :8082
    default_backend active_leader

backend ready_leader
    balance first
    option httpchk
    http-check send meth GET uri /health/leader ver HTTP/1.1 hdr Host jobmanager
    http-check expect status 200
    server jobmanager-1 jobmanager-1:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server jobmanager-2 jobmanager-2:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none

backend active_leader
    balance first
    option httpchk
    http-check send meth GET uri /health/active ver HTTP/1.1 hdr Host jobmanager
    http-check expect status 200
    server jobmanager-1 jobmanager-1:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server jobmanager-2 jobmanager-2:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none
