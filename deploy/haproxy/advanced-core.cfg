global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    option httpclose
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend external_control
    bind :8080 ssl crt /run/secrets/haproxy-pem ssl-min-ver TLSv1.2
    mode http
    default_backend ready_jobmanager

frontend internal_control
    bind :8082
    mode tcp
    option tcplog
    default_backend jobmanager_passthrough

backend ready_jobmanager
    mode http
    option httpchk
    http-check send meth GET uri /health/leader ver HTTP/1.1 hdr Host jobmanager
    http-check expect status 200
    server jobmanager jobmanager:8080 ssl verify required ca-file /run/secrets/pystream-ca crt /run/secrets/haproxy-pem check check-sni jobmanager-router-core inter 1s fall 2 rise 1

backend jobmanager_passthrough
    mode tcp
    option httpchk
    http-check send meth GET uri /health/active ver HTTP/1.1 hdr Host jobmanager
    http-check expect status 200
    server jobmanager jobmanager:8080 check check-ssl verify required ca-file /run/secrets/pystream-ca crt /run/secrets/haproxy-pem check-sni jobmanager-router-core inter 1s fall 2 rise 1
