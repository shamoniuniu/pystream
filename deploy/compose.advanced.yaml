name: pystream-advanced

x-minio-image: &minio-image minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
x-minio-client-image: &minio-client-image minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
x-haproxy-image: &haproxy-image haproxy:3.2.5-alpine@sha256:8007effce89a08af0236b9529a0daab5b8b36fa939f4162f28201f1bf8731dbf
x-kafka-image: &kafka-image apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
x-prometheus-image: &prometheus-image prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996

x-minio-environment: &minio-environment
  MINIO_ROOT_USER_FILE: /run/secrets/object-store-access-key
  MINIO_ROOT_PASSWORD_FILE: /run/secrets/object-store-secret-key
  MC_CONFIG_DIR: /tmp/.mc

x-minio-node: &minio-node
  image: *minio-image
  profiles:
    - ha
  restart: unless-stopped
  stop_grace_period: 30s
  environment: *minio-environment
  secrets:
    - object-store-access-key
    - object-store-secret-key
  expose:
    - "9000"
  command:
    - server
    - --certs-dir
    - /run/minio-certs
    - --console-address
    - :9001
    - https://minio-{1...4}/data{1...2}
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - pystream
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        mc --insecure alias set health https://127.0.0.1:9000
        "$$(cat /run/secrets/object-store-access-key)"
        "$$(cat /run/secrets/object-store-secret-key)" >/dev/null 2>&1
        && mc --insecure ready health
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s
  deploy:
    resources:
      reservations:
        cpus: "0.20"
        memory: 256M
      limits:
        cpus: "0.75"
        memory: 768M

x-pystream-environment: &pystream-environment
  PYSTREAM_OBJECT_STORE_ENDPOINT: https://minio-core:9000
  PYSTREAM_OBJECT_STORE_BUCKET: pystream
  PYSTREAM_OBJECT_STORE_REGION: us-east-1
  PYSTREAM_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object-store-access-key
  PYSTREAM_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object-store-secret-key
  PYSTREAM_OBJECT_STORE_CA_FILE: /run/secrets/pystream-ca
  PYSTREAM_TLS_CA_FILE: /run/secrets/pystream-ca
  PYSTREAM_METRICS_TOKEN_FILE: /run/secrets/metrics-token
  PYSTREAM_KAFKA_CA_FILE: /run/secrets/pystream-ca

x-pystream-ha-environment: &pystream-ha-environment
  <<: *pystream-environment
  PYSTREAM_OBJECT_STORE_ENDPOINT: https://object-store:9000

x-pystream-service: &pystream-service
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      PYTHON_VERSION: 3.11.9
      PYTHON_BASE_DIGEST: sha256:8fb099199b9f2d70342674bd9dbccd3ed03a258f26bbd1d556822c6dfc60c317
  image: pystream:0.3.0
  profiles:
    - core
  user: "10001:10001"
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 20s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  environment: *pystream-environment
  secrets:
    - object-store-access-key
    - object-store-secret-key
    - pystream-ca
    - metrics-token
  networks:
    - pystream

x-pystream-ha-service: &pystream-ha-service
  <<: *pystream-service
  profiles:
    - ha
  environment: *pystream-ha-environment

x-worker: &worker
  <<: *pystream-service
  depends_on:
    jobmanager-router-core:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    object-store-init-core:
      condition: service_completed_successfully
  expose:
    - "8081"
    - "9000"
  volumes:
    - pystream-output:/data/output
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/pystream-ca'); c.load_cert_chain('/run/secrets/service-cert','/run/secrets/service-key'); d=json.load(urllib.request.urlopen('https://localhost:8081/health', context=c, timeout=2)); assert d['status']=='ok'"
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  deploy:
    resources:
      reservations:
        cpus: "0.10"
        memory: 128M
      limits:
        cpus: "0.50"
        memory: 512M

x-ha-worker: &ha-worker
  <<: *pystream-ha-service
  depends_on:
    jobmanager-router:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    object-store-init-ha:
      condition: service_completed_successfully
  expose:
    - "8081"
    - "9000"
  volumes:
    - pystream-output:/data/output
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/pystream-ca'); c.load_cert_chain('/run/secrets/service-cert','/run/secrets/service-key'); d=json.load(urllib.request.urlopen('https://localhost:8081/health', context=c, timeout=2)); assert d['status']=='ok'"
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  deploy:
    resources:
      reservations:
        cpus: "0.10"
        memory: 128M
      limits:
        cpus: "0.50"
        memory: 512M

services:
  kafka:
    image: *kafka-image
    profiles:
      - core
      - ha
    hostname: kafka
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SSL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-server.p12
      KAFKA_SSL_KEY_CREDENTIALS: kafka-keystore-password
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka-keystore-password
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka-keystore-password
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    expose:
      - "9092"
    volumes:
      - pystream-kafka:/var/lib/kafka/data
    secrets:
      - source: kafka-server-keystore
        target: /etc/kafka/secrets/kafka-server.p12
      - source: kafka-truststore
        target: /etc/kafka/secrets/kafka-truststore.jks
      - source: kafka-keystore-password
        target: /etc/kafka/secrets/kafka-keystore-password
    networks:
      - pystream
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /tmp/kafka-client.properties --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      - /bin/bash
      - -ec
      - |
        password="$$(cat /etc/kafka/secrets/kafka-keystore-password)"
        cat >/tmp/kafka-client.properties <<EOF
        security.protocol=SSL
        ssl.keystore.type=PKCS12
        ssl.keystore.location=/etc/kafka/secrets/kafka-server.p12
        ssl.keystore.password=$${password}
        ssl.key.password=$${password}
        ssl.truststore.type=JKS
        ssl.truststore.location=/etc/kafka/secrets/kafka-truststore.jks
        ssl.truststore.password=$${password}
        ssl.endpoint.identification.algorithm=https
        EOF
        exec /etc/kafka/docker/run

  kafka-init:
    image: *kafka-image
    profiles:
      - core
      - ha
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    secrets:
      - kafka-client-keystore
      - kafka-truststore
      - kafka-keystore-password
    networks:
      - pystream
    command:
      - /bin/bash
      - -ec
      - |
        password="$$(cat /run/secrets/kafka-keystore-password)"
        cat >/tmp/kafka-client.properties <<EOF
        security.protocol=SSL
        ssl.keystore.type=PKCS12
        ssl.keystore.location=/run/secrets/kafka-client-keystore
        ssl.keystore.password=$${password}
        ssl.key.password=$${password}
        ssl.truststore.type=JKS
        ssl.truststore.location=/run/secrets/kafka-truststore
        ssl.truststore.password=$${password}
        ssl.endpoint.identification.algorithm=https
        EOF
        for topic in words intermediate-words; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --command-config /tmp/kafka-client.properties \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions 2 \
            --replication-factor 1
        done

  minio-core:
    image: *minio-image
    profiles:
      - core
    hostname: minio-core
    restart: unless-stopped
    stop_grace_period: 30s
    environment: *minio-environment
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - source: minio-core-cert
        target: /run/minio-certs/public.crt
      - source: minio-core-key
        target: /run/minio-certs/private.key
      - source: pystream-ca
        target: /run/minio-certs/CAs/pystream-ca.crt
    ports:
      - "9000:9000"
    expose:
      - "9001"
    command:
      - server
      - --certs-dir
      - /run/minio-certs
      - --console-address
      - :9001
      - /data
    volumes:
      - pystream-minio-core:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - pystream
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc --insecure alias set health https://127.0.0.1:9000
          "$$(cat /run/secrets/object-store-access-key)"
          "$$(cat /run/secrets/object-store-secret-key)" >/dev/null 2>&1
          && mc --insecure ready health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  object-store-init-core:
    image: *minio-client-image
    profiles:
      - core
    depends_on:
      minio-core:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    secrets:
      - object-store-access-key
      - object-store-secret-key
    networks:
      - pystream
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc --insecure alias set local https://minio-core:9000 \
          "$$(cat /run/secrets/object-store-access-key)" \
          "$$(cat /run/secrets/object-store-secret-key)"
        mc --insecure mb --ignore-existing local/pystream

  minio-1:
    <<: *minio-node
    hostname: minio-1
    volumes:
      - pystream-minio-1-data-1:/data1
      - pystream-minio-1-data-2:/data2
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - source: minio-1-cert
        target: /run/minio-certs/public.crt
      - source: minio-1-key
        target: /run/minio-certs/private.key
      - source: pystream-ca
        target: /run/minio-certs/CAs/pystream-ca.crt

  minio-2:
    <<: *minio-node
    hostname: minio-2
    volumes:
      - pystream-minio-2-data-1:/data1
      - pystream-minio-2-data-2:/data2
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - source: minio-2-cert
        target: /run/minio-certs/public.crt
      - source: minio-2-key
        target: /run/minio-certs/private.key
      - source: pystream-ca
        target: /run/minio-certs/CAs/pystream-ca.crt

  minio-3:
    <<: *minio-node
    hostname: minio-3
    volumes:
      - pystream-minio-3-data-1:/data1
      - pystream-minio-3-data-2:/data2
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - source: minio-3-cert
        target: /run/minio-certs/public.crt
      - source: minio-3-key
        target: /run/minio-certs/private.key
      - source: pystream-ca
        target: /run/minio-certs/CAs/pystream-ca.crt

  minio-4:
    <<: *minio-node
    hostname: minio-4
    volumes:
      - pystream-minio-4-data-1:/data1
      - pystream-minio-4-data-2:/data2
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - source: minio-4-cert
        target: /run/minio-certs/public.crt
      - source: minio-4-key
        target: /run/minio-certs/private.key
      - source: pystream-ca
        target: /run/minio-certs/CAs/pystream-ca.crt

  object-store:
    image: *haproxy-image
    profiles:
      - ha
    hostname: object-store
    depends_on:
      minio-1:
        condition: service_started
      minio-2:
        condition: service_started
      minio-3:
        condition: service_started
      minio-4:
        condition: service_started
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "9000:9000"
    volumes:
      - ./haproxy/storage.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    secrets:
      - pystream-ca
      - source: object-store-pem
        target: object-store-pem
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    networks:
      - pystream
    healthcheck:
      test:
        - CMD
        - haproxy
        - -c
        - -f
        - /usr/local/etc/haproxy/haproxy.cfg
      interval: 5s
      timeout: 3s
      retries: 10

  object-store-init-ha:
    image: *minio-client-image
    profiles:
      - ha
    depends_on:
      object-store:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    secrets:
      - object-store-access-key
      - object-store-secret-key
    networks:
      - pystream
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        until mc --insecure alias set local https://object-store:9000 \
          "$$(cat /run/secrets/object-store-access-key)" \
          "$$(cat /run/secrets/object-store-secret-key)"; do
          sleep 2
        done
        mc --insecure mb --ignore-existing local/pystream

  jobmanager:
    <<: *pystream-service
    hostname: jobmanager
    environment:
      <<: *pystream-environment
      PYSTREAM_TLS_CERT_FILE: /run/secrets/service-cert
      PYSTREAM_TLS_KEY_FILE: /run/secrets/service-key
      PYSTREAM_EXTERNAL_TOKEN_FILE: /run/secrets/external-token
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - pystream-ca
      - metrics-token
      - external-token
      - source: jobmanager-cert
        target: service-cert
      - source: jobmanager-key
        target: service-key
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      object-store-init-core:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - pystream.service
      - jobmanager
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    expose:
      - "8080"
    volumes:
      - pystream-output:/data/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/pystream-ca'); c.load_cert_chain('/run/secrets/service-cert','/run/secrets/service-key'); d=json.load(urllib.request.urlopen('https://localhost:8080/health', context=c, timeout=2)); assert d['status']=='ok'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  jobmanager-1:
    <<: *pystream-ha-service
    hostname: jobmanager-1
    environment:
      <<: *pystream-ha-environment
      PYSTREAM_TLS_CERT_FILE: /run/secrets/service-cert
      PYSTREAM_TLS_KEY_FILE: /run/secrets/service-key
      PYSTREAM_EXTERNAL_TOKEN_FILE: /run/secrets/external-token
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - pystream-ca
      - metrics-token
      - external-token
      - source: jobmanager-1-cert
        target: service-cert
      - source: jobmanager-1-key
        target: service-key
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      object-store-init-ha:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - pystream.service
      - jobmanager
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jobmanager-id
      - jobmanager-1
    expose:
      - "8080"
    volumes:
      - pystream-output:/data/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/pystream-ca'); c.load_cert_chain('/run/secrets/service-cert','/run/secrets/service-key'); json.load(urllib.request.urlopen('https://localhost:8080/health', context=c, timeout=2))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  jobmanager-2:
    <<: *pystream-ha-service
    hostname: jobmanager-2
    environment:
      <<: *pystream-ha-environment
      PYSTREAM_TLS_CERT_FILE: /run/secrets/service-cert
      PYSTREAM_TLS_KEY_FILE: /run/secrets/service-key
      PYSTREAM_EXTERNAL_TOKEN_FILE: /run/secrets/external-token
    secrets:
      - object-store-access-key
      - object-store-secret-key
      - pystream-ca
      - metrics-token
      - external-token
      - source: jobmanager-2-cert
        target: service-cert
      - source: jobmanager-2-key
        target: service-key
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      object-store-init-ha:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - pystream.service
      - jobmanager
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jobmanager-id
      - jobmanager-2
    expose:
      - "8080"
    volumes:
      - pystream-output:/data/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/pystream-ca'); c.load_cert_chain('/run/secrets/service-cert','/run/secrets/service-key'); json.load(urllib.request.urlopen('https://localhost:8080/health', context=c, timeout=2))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  jobmanager-router-core:
    image: *haproxy-image
    profiles:
      - core
    hostname: jobmanager-router-core
    depends_on:
      jobmanager:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    expose:
      - "8082"
    volumes:
      - ./haproxy/advanced-core.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    secrets:
      - pystream-ca
      - source: haproxy-pem
        target: haproxy-pem
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    networks:
      - pystream
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate -q -T 2 -O /dev/null https://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 10

  jobmanager-router:
    image: *haproxy-image
    profiles:
      - ha
    hostname: jobmanager-router
    depends_on:
      jobmanager-1:
        condition: service_healthy
      jobmanager-2:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    expose:
      - "8082"
    volumes:
      - ./haproxy/advanced.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    secrets:
      - pystream-ca
      - source: haproxy-pem
        target: haproxy-pem
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    networks:
      - pystream
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate -q -T 2 -O /dev/null https://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 10

  worker-1:
    <<: *worker
    hostname: worker-1
    environment:
      <<: *pystream-environment
      PYSTREAM_TLS_CERT_FILE: /run/secrets/service-cert
      PYSTREAM_TLS_KEY_FILE: /run/secrets/service-key
      PYSTREAM_KAFKA_CERT_FILE: /run/secrets/service-cert
