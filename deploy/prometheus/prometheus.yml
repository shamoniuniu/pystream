global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pystream-jobmanagers
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/secrets/pystream-ca
      cert_file: /run/secrets/prometheus-cert
      key_file: /run/secrets/prometheus-key
    static_configs:
      - targets:
          - jobmanager:8080
          - jobmanager-1:8080
          - jobmanager-2:8080

  - job_name: pystream-workers
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/secrets/pystream-ca
      cert_file: /run/secrets/prometheus-cert
      key_file: /run/secrets/prometheus-key
    static_configs:
      - targets:
          - worker-1:8081
          - worker-2:8081
          - worker-3:8081
          - worker-ha-1:8081
          - worker-ha-2:8081
          - worker-ha-3:8081
